{{ define "main" }}
{{ $paginator := partial "paginator.html" . }}
<section class="reading-container home-list">
  <ul>
    {{ range $paginator.Pages }}
    <li class="py-4">
      <h2 class="text-xl font-bold mb-2"><a class="mt-2 block" href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      <time class="text-gray-600" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_medium" }}</time>
    </li>
    {{ end }}
  </ul>
  {{ partial "pagination.html" $paginator }}
</section>
{{ end }}
