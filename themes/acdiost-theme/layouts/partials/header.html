<header class="w-full py-4">
  <div class="container mx-auto flex flex-wrap items-center justify-between gap-y-4 px-4">
    <a class="font-bold text-lg shrink-0" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    <button id="menu-toggle" type="button" aria-label="打开导航" aria-expanded="false" aria-controls="site-menu"
      class="flex items-center px-3 py-2 border rounded text-gray-800 border-gray-400 hover:text-black hover:border-black md:hidden">
      <svg class="h-3 w-3 fill-current" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <path d="M0 3h20v2H0V3zm0 6h20v2H0V9zm0 6h20v2H0v-2z" />
      </svg>
    </button>
    <nav id="site-menu" class="menu hidden w-full md:block md:w-auto" aria-label="主导航">
      <ul class="flex flex-col gap-3 md:flex-row md:items-center md:gap-6">
        <li><a href="{{ "categories/" | relURL }}">Categories</a></li>
        <li><a href="https://github.com/acdiost" target="_blank" rel="noopener noreferrer">GitHub</a></li>
        {{- with site.GetPage "/posts/about" }}
        <li><a href="{{ .RelPermalink }}">About Me</a></li>
        {{- end }}
      </ul>
    </nav>
  </div>
</header>
