{{ if gt .TotalPages 1 }}
<nav class="pagination" aria-label="分页">
  <div>
    {{ if .HasPrev }}
    <a class="pagination-link" href="{{ .Prev.URL }}" rel="prev">&larr; Previous</a>
    {{ end }}
  </div>
  <span>Page {{ .PageNumber }} of {{ .TotalPages }}</span>
  <div>
    {{ if .HasNext }}
    <a class="pagination-link" href="{{ .Next.URL }}" rel="next">Next &rarr;</a>
    {{ end }}
  </div>
</nav>
{{ end }}
